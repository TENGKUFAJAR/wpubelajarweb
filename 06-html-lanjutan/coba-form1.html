<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <form>
        <label for="nama">Nama:</label>
        <input type="text" name="nama" id="nama" placeholder="Masukan Nama">

        <br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Masukan Email">

        <br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Masukan Password">
        <br>

        <label for="alamat">Alamat:</label>
        <textarea name="alamat" id="alamat" cols="30" rows="5"  placeholder="Masukan Alamat"></textarea>    
        <br>
        <button type="submit">kirim!</button>
    </form>
</body>
</html>
