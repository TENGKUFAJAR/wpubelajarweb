<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form Di Dalam Table</title>
</head>
<body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <form>
        <table>
        <tr>
            <td align="right"><label for="nama">Nama:</label></td>
            <td><input type="text" name="nama" id="nama" placeholder="Masukan Nama">
</td>
        </tr>
        <tr>
            <td align="right"><label for="email">Email:</label></td>
            <td><input type="email" name="email" id="email" placeholder="Masukan Email"></td>
        </tr>
        <tr>
            <td align="right"><label for="password">Password:</label></td>
            <td> <input type="password" name="password" id="password" placeholder="Masukan Password"></td>
        </tr>
        <tr>
            <td align="right"> <label for="date">Tanggal Lahir:</label></td>
            <td> <input type="date" name="date" id="date"></td>
        </tr>
        <tr>
            <td align="right"> <label for="color">Warna Favorit:</label></td>
            <td> <input type="color" name="color" id="color"> </td>
        </tr>
        <tr>
            <td align="right"> 
        <label for="alamat">Alamat:</label></td>
            <td><textarea name="alamat" id="alamat" cols="30" rows="5"  placeholder="Masukan Alamat"></textarea> </td>
        </tr>
        <tr>
            <td>
                 <button type="submit">kirim!</button>
            </td>
            <td></td>
        </tr>

        </table>

       
    </form>
</body>
</html>
