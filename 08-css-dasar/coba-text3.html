<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Overflow & Text Shadow</title>
   
    <style>
      p {
        font-size: 26px;
        white-space: nowrap;
        background-color: lightblue;
        width: 400px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      h1 {
        font-size: 100px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 5px 5px 0px yellow;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: red;
        text-decoration-skip-ink: none;
      }

    </style>
</head>
<body>

    <h1>Hello, CSS!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eveniet optio error animi, obcaecati fugiat facilis aliquid sunt repudiandae quam fuga! Illum inventore, distinctio optio laborum numquam ullam culpa accusantium dolores.</p>

</body>
</html>
